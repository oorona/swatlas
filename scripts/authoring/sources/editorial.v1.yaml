  - {from: han-solo, to: kylo-ren, type: parent_of, quote: "son of Han Solo and Leia Organa", in: kylo-ren}
  - {from: leia-organa, to: kylo-ren, type: parent_of, quote: "son of Han Solo and Leia Organa", in: kylo-ren}
  - {from: luke-skywalker, to: kylo-ren, type: trained, quote: "trained by Luke then Snoke", in: kylo-ren}
  - {from: emperor-palpatine, to: rey, type: grandparent_of, quote: "granddaughter of Palpatine", in: rey}
  - {from: luke-skywalker, to: rey, type: trained, quote: "trained by Luke and Leia", in: rey}
  - {from: leia-organa, to: rey, type: trained, quote: "trained by Luke and Leia", in: rey}
