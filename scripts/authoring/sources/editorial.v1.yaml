  - {from: obi-wan-kenobi, to: darth-vader, type: trained, quote: "trained Anakin Skywalker", in: obi-wan-kenobi, note: "Anakin Skywalker is resolved to Darth Vader through Vader's 'formerly Anakin Skywalker'."}
  - {from: obi-wan-kenobi, to: luke-skywalker, type: guardian_of, quote: "guardian of Luke", in: obi-wan-kenobi}
