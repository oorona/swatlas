  - {from: luke-skywalker, to: darth-vader, type: redeemed, quote: "redeemed his father", in: luke-skywalker, note: "'his father' is resolved to Darth Vader through Vader's 'father of Luke and Leia'."}
  - {from: darth-vader, to: emperor-palpatine, type: serves, quote: "serves the Emperor", in: darth-vader, note: "'the Emperor' is resolved to Emperor Palpatine."}
