[project]
name = "swatlas-authoring"
version = "1.0.0"
description = "Offline authoring pipeline for the swatlas artifact bundle"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sentence-transformers==6.1.0",
    "torch==2.14.0",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "umap-learn==0.5.12",
    "pyyaml==6.0.3",
    "huggingface-hub>=1.3,<2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
